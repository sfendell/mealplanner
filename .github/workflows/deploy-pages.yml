name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "index.html"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Publish built site to repo root
        run: |
          rm -rf assets
          cp -r dist/* .
          touch .nojekyll

      - name: Commit and push built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html assets .nojekyll
          if git diff --staged --quiet; then
            echo "No deploy changes"
            exit 0
          fi
          git commit -m "Deploy built site [skip ci]"
          git push
